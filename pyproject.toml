[project]
name = "dd-verifier"
version = "0.1.0"
description = "Автоматическая проверка утверждений стартапа (питч-дек, пресс-релизы) по данным data room для due diligence венчурного фонда"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bulat Gumerov" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "pre-commit>=4.0",
    "pytest>=9.2.0",
    "ruff==0.17.3",  # держим в синхроне с rev хука в .pre-commit-config.yaml
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_verifier"]

# ---------------------------------------------------------------------------
# Ruff: линтер + форматтер (заменяет flake8, isort, black, pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]
ignore = [
    # Кириллица в строках/докстрингах/комментариях — это норма для проекта,
    # а не «похожие» символы (иначе ruff ругается на каждую русскую «с», «о», «а»).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]  # импорты по ячейкам и длинные строки вывода в ноутбуках
"tests/**" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["dd_verifier"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
