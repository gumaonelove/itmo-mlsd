# Конфиг генератора синтетического data room (P2 дизайн-документа).
# Запуск: uv run python -m dd_verifier.synth --config configs/synth.yaml --out data/synthetic
#
# 15 компаний: Pantrio + 4 = dev, 10 = holdout. Параметры holdout здесь есть, но сгенерированные
# holdout-компании во время разработки не открываются (EDA читает только dev и holdout_summary.json).
# Случаи каталога (configs/discrepancy_catalog.yaml) распределяются по компаниям автоматически
# (assignment_seed): каждый id ≥ coverage_min раз в сплите; у Pantrio список задан явно.

generator_version: "0.1.0"
end_month: "2025-12"          # последний закрытый месяц истории; документы датированы январём 2026
assignment_seed: 20251231
coverage_min: {dev: 1, holdout: 2}
cases_per_company: {dev: [8, 10], holdout: [8, 11]}
claims_per_company: [15, 45]

# Шум «грязной» выгрузки. Откалиброван по UCI Online Retail II
# (reports/eda/02_billing_proxy.md, раздел 12) с пересчётом с B2C-ритейла на B2B SaaS;
# обоснование каждого значения — data/README.md, раздел 1.7. Меняется только этот блок.
noise:
  duplicate_invoice_rate: 0.005          # точные дубли строк; ритейл 1,13% строк → SaaS 0,5% (0,2–1,5%)
  missing_customer_id_rate: 0.002        # пустой customer_id; C предлагал 1%, но ≥0,3% меняет эталон (EDA 03)
  void_reissue_rate: 0.01                # void + перевыставленный; ритейл 0,9% тех. строк → 1% (0,5–2%)
  erroneous_invoice_credit_rate: 0.01    # инвойс + ПОЛНАЯ кредит-нота: 3% кредит-нот × 1/3 полных
  late_issue_rate: 0.02                  # выставлен на 1–2 мес. позже; не измерено, верх диапазона 0,5–2%
  late_issue_max_months: 2
  customer_name_case_rate: 0.05          # другое написание имени в справочнике (регистр, Inc./LLC)
  customer_duplicate_record_rate: 0.01   # запись-дубль клиента с вариантом имени, без инвойсов

defaults:
  months: 36
  price_sigma: 0.35
  annual_prepay_share: 0.15
  reseller_share: 0.0
  reseller_fee_rate: 0.2
  currency_mix: {USD: 0.85, EUR: 0.10, GBP: 0.05}
  impl_fee_months: 1.0        # платёж за внедрение в месяцах подписки
  onboarding_months: 2        # на сколько месяцев распределён платёж за внедрение
  one_time_prob: 0.01         # вероятность разового платежа (обучение) у клиента в месяц
  pilot_rate: 0.012           # новые бесплатные пилоты в месяц на одного активного клиента
  expansion: {monthly_prob: 0.03, size: 0.2, contraction_prob: 0.01, annual_uplift: 0.06}
  press_releases: 2
  plain_claims: [8, 12]       # число корректных утверждений без случаев каталога
  family_rate: 0.40           # доля утверждений, повторённых в пресс-релизе (семейство)
  doc_name_variant_rate: 0.6  # доля упоминаний клиентов с другим написанием имени

